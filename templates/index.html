<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat IA - Panel Principal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b141a;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100dvh;
      background-color: #111b21;
      position: relative;
      overflow: hidden;
    }

    /* Sidebar (Lista de chats) */
    .sidebar {
      width: 380px;
      min-width: 380px;
      background-color: #111b21;
      border-right: 1px solid #222d34;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 14px 16px;
      background-color: #202c33;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      color: #e9edef;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      background-color: #00a884;
      color: #111b21;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-danger {
      background-color: #202c33;
      color: #ef4444;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #222d34;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chat-item:hover {
      background-color: #202c33;
    }

    .chat-item.activo {
      background-color: #2a3942;
    }

    .chat-item-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-item-titulo {
      font-size: 0.95rem;
      color: #e9edef;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-meta {
      font-size: 0.75rem;
      color: #8696a0;
      margin-top: 3px;
    }

    .btn-delete-item {
      background: transparent;
      border: none;
      color: #8696a0;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.9rem;
      border-radius: 4px;
    }

    .btn-delete-item:hover {
      color: #ef4444;
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0b141a;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      height: 100%;
      min-width: 0;
    }

    .chat-header {
      padding: 10px 16px;
      background-color: #202c33;
      display: flex;
      align-items: center;
      height: 60px;
      border-bottom: 1px solid #222d34;
      gap: 10px;
    }

    .chat-header h3 {
      font-size: 1rem;
      color: #e9edef;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitulo {
      font-size: 0.75rem;
      color: #8696a0;
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      color: #8696a0;
      margin: auto;
      font-size: 0.95rem;
    }

    /* Burbujas de Chat */
    .bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.3);
    }

    .bubble.user {
      background-color: #005c4b;
      color: #e9edef;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .bubble.ia {
      background-color: #202c33;
      color: #e9edef;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animar-entrada {
      animation: fadeIn 0.2s ease-out forwards;
    }

    /* Burbuja escribiendo (...) */
    .typing-bubble {
      background-color: #202c33;
      padding: 12px 16px;
      border-radius: 8px;
      border-top-left-radius: 0;
      align-self: flex-start;
      display: flex;
      gap: 5px;
      align-items: center;
      height: 34px;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background-color: #8696a0;
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-bubble span:nth-child(1) { animation-delay: -0.32s; }
    .typing-bubble span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* Área de input */
    .input-area {
      padding: 10px 16px;
      background-color: #202c33;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-area textarea {
      flex: 1;
      background-color: #2a3942;
      color: #e9edef;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      resize: none;
      max-height: 100px;
      outline: none;
      font-family: inherit;
    }

    .input-area textarea::placeholder {
      color: #8696a0;
    }

    .input-area button {
      background-color: #00a884;
      color: #111b21;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .input-area button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ==========================================
       ADAPTABILIDAD MÓVIL (Menú Emergente < 768px)
       ========================================== */
    @media (max-width: 768px) {
      .app-container {
        position: relative;
        width: 100vw;
        height: 100dvh;
      }

      .chat-area {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        width: 85%;
        max-width: 320px;
        height: 100%;
        z-index: 10;
        background-color: #111b21;
        box-shadow: 4px 0px 15px rgba(0, 0, 0, 0.6);
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
      }

      .app-container.mostrar-sidebar .sidebar {
        transform: translateX(0);
      }

      .app-container.mostrar-sidebar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background: rgba(0, 0, 0, 0.6);
        z-index: 5;
      }

      #btn-toggle-sidebar {
        display: inline-block !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- Sidebar / Panel lateral (Emergente en móviles) -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <div class="sidebar-actions">
          <button class="btn-primary" onclick="crearNuevoChat()">+ Nuevo</button>
          <button class="btn-danger" onclick="borrarTodosLosChats()" title="Borrar todo">🗑️</button>
        </div>
      </div>
      <div class="chat-list" id="chatList">
        <!-- Lista cargada dinámicamente -->
      </div>
    </div>

    <!-- Área Principal de Chat -->
    <div class="chat-area">
      <div class="chat-header">
        <button id="btn-toggle-sidebar" class="btn-primary" style="display: none; padding: 6px 10px;">☰</button>
        <div>
          <h3 id="chat-titulo-actual">Selecciona o crea un chat</h3>
          <span class="subtitulo" id="chat-subtitulo">Panel de conversación</span>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">No hay chat seleccionado. Elige uno de la lista o crea uno nuevo.</div>
      </div>

      <div class="input-area" id="inputArea" style="display: none;">
        <textarea id="messageInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
        <button id="sendButton" onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    let chatActual = null;
    const appContainer = document.getElementById("appContainer");
    const btnToggleSidebar = document.getElementById("btn-toggle-sidebar");

    btnToggleSidebar.addEventListener("click", () => {
      appContainer.classList.toggle("mostrar-sidebar");
    });

    function actualizarContadorHeader(cantidadOpcional = null) {
      if (!chatActual) return;
      const total = cantidadOpcional !== null
        ? cantidadOpcional
        : document.querySelectorAll("#messagesContainer .bubble").length;
      document.getElementById("chat-subtitulo").textContent = `${total} ${total === 1 ? "mensaje" : "mensajes"}`;
    }

    async function cargarListaChats() {
      try {
        const res = await fetch("/api/chats");
        const chats = await res.json();
        const listaDiv = document.getElementById("chatList");
        listaDiv.innerHTML = "";

        if (chats.length === 0) {
          listaDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #8696a0; font-size: 0.9rem;">No hay chats guardados</div>';
          return;
        }

        chats.forEach(chat => {
          const item = document.createElement("div");
          item.className = `chat-item ${chat.archivo === chatActual ? "activo" : ""}`;
          item.innerHTML = `
            <div class="chat-item-info" onclick="seleccionarChat('${chat.archivo}')">
              <div class="chat-item-titulo">${chat.titulo}</div>
              <div class="chat-item-meta">${chat.total} ${chat.total === 1 ? "mensaje" : "mensajes"}</div>
            </div>
            <button class="btn-delete-item" onclick="event.stopPropagation(); borrarChat('${chat.archivo}')">✕</button>
          `;
          listaDiv.appendChild(item);

          if (chat.archivo === chatActual) {
            actualizarContadorHeader(chat.total);
          }
        });
      } catch (err) {
        console.error("Error al cargar chats:", err);
      }
    }

    async function crearNuevoChat() {
      try {
        const res = await fetch("/api/chats/nuevo", { method: "POST" });
        const data = await res.json();
        await seleccionarChat(data.archivo);
        await cargarListaChats();
      } catch (err) {
        console.error("Error al crear chat:", err);
      }
    }

    async function seleccionarChat(archivo) {
      chatActual = archivo;
      if (window.innerWidth <= 768) {
        appContainer.classList.remove("mostrar-sidebar");
      }
      cargarListaChats();

      try {
        const res = await fetch(`/api/chats/${archivo}`);
        const data = await res.json();
        const mensajes = Array.isArray(data.mensajes) ? data.mensajes : [];

        document.getElementById("chat-titulo-actual").textContent = data.titulo;
        document.getElementById("inputArea").style.display = "flex";

        const container = document.getElementById("messagesContainer");
        container.innerHTML = "";

        if (mensajes.length === 0) {
          container.innerHTML = '<div class="empty-state">Escribe un mensaje para comenzar la conversación.</div>';
        } else {
          mensajes.forEach(msg => agregarBurbujaUI(msg.remitente, msg.texto, false, false));
        }
        actualizarContadorHeader(mensajes.length);
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error("Error al cargar mensajes:", err);
      }
    }

    function agregarBurbujaUI(remitente, texto, animar = true, refrescarContador = true) {
      const container = document.getElementById("messagesContainer");
      
      const emptyState = container.querySelector(".empty-state");
      if (emptyState) emptyState.remove();

      const bubble = document.createElement("div");
      bubble.className = `bubble ${remitente.toLowerCase() === 'user' ? 'user' : 'ia'} ${animar ? 'animar-entrada' : ''}`;
      bubble.textContent = texto;
      container.appendChild(bubble);

      if (refrescarContador) {
        actualizarContadorHeader();
      }
      container.scrollTop = container.scrollHeight;
    }

    function mostrarEscribiendo() {
      const container = document.getElementById("messagesContainer");
      const typingDiv = document.createElement("div");
      typingDiv.className = "typing-bubble animar-entrada";
      typingDiv.id = "typingIndicator";
      typingDiv.innerHTML = "<span></span><span></span><span></span>";
      container.appendChild(typingDiv);
      container.scrollTop = container.scrollHeight;
    }

    function ocultarEscribiendo() {
      const typingDiv = document.getElementById("typingIndicator");
      if (typingDiv) typingDiv.remove();
    }

    async function enviarMensaje() {
      const input = document.getElementById("messageInput");
      const texto = input.value.trim();
      if (!texto || !chatActual) return;

      input.value = "";
      input.style.height = "auto";
      agregarBurbujaUI("USER", texto);

      const sendBtn = document.getElementById("sendButton");
      sendBtn.disabled = true;

      try {
        await fetch(`/api/chats/${chatActual}/mensaje`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto })
        });
        cargarListaChats();

        mostrarEscribiendo();

        const res = await fetch(`/api/chats/${chatActual}/responder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto_usuario: texto })
        });

        const data = await res.json();
        ocultarEscribiendo();
        agregarBurbujaUI(data.remitente, data.texto);
        cargarListaChats();
      } catch (err) {
        ocultarEscribiendo();
        console.error("Error al enviar mensaje:", err);
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function borrarChat(archivo) {
      if (!confirm("¿Seguro que deseas eliminar este chat?")) return;
      try {
        await fetch(`/api/chats/${archivo}`, { method: "DELETE" });
        if (chatActual === archivo) {
          chatActual = null;
          document.getElementById("chat-titulo-actual").textContent = "Selecciona o crea un chat";
          document.getElementById("chat-subtitulo").textContent = "Panel de conversación";
          document.getElementById("messagesContainer").innerHTML = '<div class="empty-state">No hay chat seleccionado. Elige uno de la lista o crea uno nuevo.</div>';
          document.getElementById("inputArea").style.display = "none";
        }
        cargarListaChats();
      } catch (err) {
        console.error("Error al borrar chat:", err);
      }
    }

    async function borrarTodosLosChats() {
      if (!confirm("¿Deseas eliminar TODO el historial de chats?")) return;
      try {
        await fetch("/api/chats/borrar_todos", { method: "DELETE" });
        chatActual = null;
        document.getElementById("chat-titulo-actual").textContent = "Selecciona o crea un chat";
        document.getElementById("chat-subtitulo").textContent = "Panel de conversación";
        document.getElementById("messagesContainer").innerHTML = '<div class="empty-state">No hay chat seleccionado. Elige uno de la lista o crea uno nuevo.</div>';
        document.getElementById("inputArea").style.display = "none";
        cargarListaChats();
      } catch (err) {
        console.error("Error al borrar todos los chats:", err);
      }
    }

    const messageInput = document.getElementById("messageInput");
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        enviarMensaje();
      }
    });

    cargarListaChats();
  </script>
</body>
</html>
