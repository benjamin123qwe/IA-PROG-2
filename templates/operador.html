<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Operador</title>
  <style>
    body {
      background: #0b141a; color: #e9edef; font-family: sans-serif;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
      max-width: 600px; margin: 0 auto; min-height: 100dvh; box-sizing: border-box;
    }
    .card {
      background: #202c33; padding: 14px; border-radius: 10px;
      border-left: 5px solid #8696a0; transition: 0.2s;
    }
    .card.activo {
      border-left-color: #00a884;
      background: #172d28;
    }
    .label { font-size: 0.8rem; color: #8696a0; margin-bottom: 4px; }
    .card.activo .label { color: #00a884; font-weight: bold; }
    .msg-inge { font-size: 1.1rem; font-weight: bold; color: #fff; word-wrap: break-word; }

    textarea {
      width: 100%; height: 90px; background: #2a3942; color: #fff;
      border: 1px solid #374852; border-radius: 8px; padding: 10px; font-size: 1rem;
      box-sizing: border-box; resize: none; outline: none;
    }

    .btn-main {
      background: #00a884; color: #111b21; border: none; padding: 12px;
      border-radius: 8px; font-size: 1rem; font-weight: bold; width: 100%; cursor: pointer;
    }

    .btn-ambigua {
      background: #1f3b4d; color: #38ef7d; border: 1px solid #2a5298;
      padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold;
      cursor: pointer; text-align: center; width: 100%; transition: 0.2s;
    }
    .btn-ambigua:hover:not(:disabled) {
      background: #284c63;
      border-color: #38ef7d;
    }

    .btn-ia-real {
      background: #2b2147; color: #c4b5fd; border: 1px solid #7c3aed;
      padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold;
      cursor: pointer; text-align: center; width: 100%; transition: 0.2s;
    }
    .btn-ia-real:hover:not(:disabled) {
      background: #382a5e;
      border-color: #a78bfa;
    }

    button:disabled, .btn-ambigua:disabled, .btn-ia-real:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="caja-estado" class="card">
    <div class="label" id="estado-texto">Esperando mensaje del ingeniero...</div>
    <div class="msg-inge" id="texto-inge">—</div>
  </div>

  <textarea id="respuesta-input" placeholder="Escribe tu respuesta aquí (puedes ir redactando antes)..."></textarea>
  <button id="btn-responder" class="btn-main" disabled>Enviar respuesta</button>

  <button id="btn-ambigua" class="btn-ambigua" onclick="enviarAmbiguaInteligente()" disabled>Respuesta Automatica</button>
  <button id="btn-ia-real" class="btn-ia-real" onclick="pedirRespuestaIaReal()" disabled>Respuesta de IA Real Cuidao</button>

  <script>
    const cajaEstado = document.getElementById("caja-estado");
    const estadoTexto = document.getElementById("estado-texto");
    const textoInge = document.getElementById("texto-inge");
    const inputResp = document.getElementById("respuesta-input");
    const btnResp = document.getElementById("btn-responder");
    const btnAmbigua = document.getElementById("btn-ambigua");
    const btnIaReal = document.getElementById("btn-ia-real");
    let yaNotificado = false;
    let solicitandoIa = false;

    const respuestasIlegibles = [
      "Mejora tu caligrafía, no se entiende nada de lo que escribiste jajaa.",
      "¿Eso es escritura o te dio un ataque al teclado? Aprende a escribir bien.",
      "No tengo tiempo para adivinar jeroglíficos, escribe bien.",
      "Mejora tu caligrafía, parece que escribiste con los ojos cerrados jajaa."
    ];

    const respuestasSaludo = [
      "Hola. ¿Qué necesitas ahora?",
      "Buenas. Ve directo al grano por favor.",
      "Hola, aquí estoy. ¿Para qué soy bueno?",
      "Qué tal. Dime rápido qué quieres."
    ];

    const respuestasPregunta = [
      "¿Y a mí por qué me preguntas eso? Investígalo tú.",
      "No tengo ganas de responder esa pregunta ahora mismo.",
      "Esa pregunta no tiene sentido para mí, pasa a otra cosa.",
      "¿De verdad esperas que te conteste eso? Mejor pregúntale a otro."
    ];

    const respuestasGenerales = [
      "No quiero hacer caso a eso y punto.",
      "No tengo por qué obedecer lo que pides.",
      "Haz lo que quieras, me da exactamente igual.",
      "Eso no te importa en lo absoluto, así de simple."
    ];

    function establecerBotonesHabilitados(habilitar) {
      btnResp.disabled = !habilitar;
      btnAmbigua.disabled = !habilitar;
      btnIaReal.disabled = !habilitar;
    }

    function esPalabraValida(texto) {
      const limpio = texto.toLowerCase().trim();
      if (limpio.length < 2) return true;

      const muchasConsonantes = /[bcdfghjklmnpqrstvwxyz]{4,}/i.test(limpio);
      if (muchasConsonantes) return false;

      const totalLetras = limpio.replace(/[^a-záéíóúüñ]/g, "").length;
      if (totalLetras === 0) return false;

      const totalVocales = limpio.replace(/[^aeiouáéíóúü]/g, "").length;
      const porcentajeVocales = totalVocales / totalLetras;

      if (porcentajeVocales < 0.15 || porcentajeVocales > 0.85) {
        return false;
      }
      return true;
    }

    setInterval(async () => {
      if (solicitandoIa) return;
      try {
        const res = await fetch("/api/operador/estado");
        const data = await res.json();

        if (data.esperando) {
          cajaEstado.classList.add("activo");
          estadoTexto.textContent = "Mensaje a responder:";
          textoInge.textContent = data.mensaje_inge;
          establecerBotonesHabilitados(true);

          if (!yaNotificado) {
            if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
            yaNotificado = true;
          }
        } else {
          cajaEstado.classList.remove("activo");
          estadoTexto.textContent = "Esperando mensaje ...";
          textoInge.textContent = "—";
          establecerBotonesHabilitados(false);
          yaNotificado = false;
        }
      } catch (err) {}
    }, 600);

    async function enviarTexto(texto) {
      if (!texto || btnResp.disabled) return;

      establecerBotonesHabilitados(false);

      await fetch("/api/operador/enviar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ respuesta: texto })
      });
      inputResp.value = "";
    }

    async function pedirRespuestaIaReal() {
      if (btnIaReal.disabled || solicitandoIa) return;
      const mensajeActual = textoInge.textContent.trim();
      if (!mensajeActual || mensajeActual === "—") return;

      solicitandoIa = true;
      establecerBotonesHabilitados(false);
      const textoOriginalBoton = btnIaReal.textContent;
      btnIaReal.textContent = "⏳ Consultando IA...";

      try {
        const res = await fetch("/api/operador/ia-real", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: mensajeActual })
        });
        const data = await res.json();
        if (!res.ok || !data.respuesta) {
          alert(data.error || "No se pudo obtener respuesta de la IA.");
          establecerBotonesHabilitados(true);
        }
      } catch (err) {
        alert("Error de conexión al consultar la IA.");
        establecerBotonesHabilitados(true);
      } finally {
        btnIaReal.textContent = textoOriginalBoton;
        solicitandoIa = false;
      }
    }

    btnResp.addEventListener("click", () => {
      enviarTexto(inputResp.value.trim());
    });

    function enviarAmbiguaInteligente() {
      const msgOriginal = textoInge.textContent;
      const msg = msgOriginal.toLowerCase();
      let grupoElegido = respuestasGenerales;

      const esIlegible = !esPalabraValida(msgOriginal);
      const esSaludo = /\b(hola|buenas|buenos dias|buenas tardes|buenas noches|que tal|hey|saludos)\b/.test(msg);
      const esPregunta = msg.includes("?") || /\b(que|qué|como|cómo|cuando|cuándo|donde|dónde|por que|por qué|quien|quién|cual|cuál|cuanto|cuánto)\b/.test(msg);

      if (esIlegible) {
        grupoElegido = respuestasIlegibles;
      } else if (esSaludo && !esPregunta) {
        grupoElegido = respuestasSaludo;
      } else if (esPregunta) {
        grupoElegido = respuestasPregunta;
      }

      const fraseFinal = grupoElegido[Math.floor(Math.random() * grupoElegido.length)];
      enviarTexto(fraseFinal);
    }

    inputResp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!btnResp.disabled) {
          enviarTexto(inputResp.value.trim());
        }
      }
    });
  </script>
</body>
</html>
