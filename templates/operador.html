<script>
    const cajaEstado = document.getElementById("caja-estado");
    const estadoTexto = document.getElementById("estado-texto");
    const textoInge = document.getElementById("texto-inge");
    const inputResp = document.getElementById("respuesta-input");
    const btnResp = document.getElementById("btn-responder");
    const btnAmbigua = document.getElementById("btn-ambigua");
    let yaNotificado = false;

    // 1. Respuestas si detecta un saludo
    const respuestasSaludo = [
      "Hola. ¿Qué necesitas ahora?",
      "Buenas. Ve directo al grano por favor.",
      "Hola, aquí estoy. ¿Para qué soy bueno?",
      "Qué tal. Dime rápido qué quieres."
    ];

    // 2. Respuestas si detecta una pregunta (tiene '?' o palabras interrogativas)
    const respuestasPregunta = [
      "¿Y a mí por qué me preguntas eso? Investígalo tú.",
      "No tengo ganas de responder esa pregunta ahora mismo.",
      "Esa pregunta no tiene sentido para mí, pasa a otra cosa.",
      "¿De verdad esperas que te conteste eso? Mejor pregúntale a otro."
    ];

    // 3. Respuestas evasivas generales (para órdenes o comentarios)
    const respuestasGenerales = [
      "No quiero hacer caso a eso y punto.",
      "No tengo por qué obedecer lo que me pides.",
      "Haz lo que quieras, me da exactamente igual.",
      "Eso no te importa en lo absoluto, así de simple."
    ];

    setInterval(async () => {
      try {
        const res = await fetch("/api/operador/estado");
        const data = await res.json();

        if (data.esperando) {
          cajaEstado.classList.add("activo");
          estadoTexto.textContent = "Mensaje a responder:";
          textoInge.textContent = data.mensaje_inge;
          inputResp.disabled = false;
          btnResp.disabled = false;
          btnAmbigua.disabled = false;

          if (!yaNotificado) {
            if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
            yaNotificado = true;
          }
        } else {
          cajaEstado.classList.remove("activo");
          estadoTexto.textContent = "Esperando mensaje ...";
          textoInge.textContent = "—";
          inputResp.disabled = true;
          btnResp.disabled = true;
          btnAmbigua.disabled = true;
          yaNotificado = false;
        }
      } catch (err) {}
    }, 600);

    async function enviarTexto(texto) {
      if (!texto) return;

      btnResp.disabled = true;
      inputResp.disabled = true;
      btnAmbigua.disabled = true;

      await fetch("/api/operador/enviar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ respuesta: texto })
      });
      inputResp.value = "";
    }

    btnResp.addEventListener("click", () => {
      enviarTexto(inputResp.value.trim());
    });

    function enviarAmbiguaAleatoria() {
      // Leemos el mensaje del ingeniero en minúsculas para analizarlo
      const msg = textoInge.textContent.toLowerCase();
      let grupoElegido = respuestasGenerales;

      // Detectar si es saludo
      const esSaludo = /\b(hola|buenas|buenos dias|buenas tardes|buenas noches|que tal|hey|saludos)\b/.test(msg);
      
      // Detectar si es pregunta
      const esPregunta = msg.includes("?") || /\b(que|qué|como|cómo|cuando|cuándo|donde|dónde|por que|por qué|quien|quién|cual|cuál|cuanto|cuánto)\b/.test(msg);

      if (esSaludo && !esPregunta) {
        grupoElegido = respuestasSaludo;
      } else if (esPregunta) {
        grupoElegido = respuestasPregunta;
      }

      // Elegir una frase al azar dentro del grupo correspondiente
      const fraseFinal = grupoElegido[Math.floor(Math.random() * grupoElegido.length)];
      enviarTexto(fraseFinal);
    }

    inputResp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        enviarTexto(inputResp.value.trim());
      }
    });
  </script>
